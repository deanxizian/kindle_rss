name: RSS to Kindle Daily Digest

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 22:00 UTC = 06:00 next day in Beijing time (UTC+8).
    - cron: "0 22 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RSS2KINDLE_STATE_DB: .rss_to_kindle/state.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate config
        run: python -m rss_to_kindle.cli config-check --config feeds.yml

      - name: Run digest
        run: python -m rss_to_kindle.cli run --config feeds.yml

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-to-kindle-output
          path: |
            output/
            .rss_to_kindle/state.db
          if-no-files-found: ignore
